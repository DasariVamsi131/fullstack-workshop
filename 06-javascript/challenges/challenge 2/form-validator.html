<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Form Validator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      background: white;
      padding: 20px;
      width: 320px;
      border-radius: 5px;
    }

    .form-group {
      margin-bottom: 15px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 3px;
    }

    .success {
      border: 2px solid green;
    }

    .check {
      color: green;
      position: absolute;
      right: 10px;
      top: 36px;
      display: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: gray;
      color: white;
      border: none;
      cursor: not-allowed;
    }

    button.enabled {
      background: green;
      cursor: pointer;
    }
  </style>
</head>
<body>

<form id="registerForm" novalidate>
  <h2>Register</h2>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username">
    <span class="check">✔</span>
    <div class="error"></div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email">
    <span class="check">✔</span>
    <div class="error"></div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password">
    <span class="check">✔</span>
    <div class="error"></div>
  </div>

  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword">
    <span class="check">✔</span>
    <div class="error"></div>
  </div>

  <button type="submit" id="submitBtn" disabled>Submit</button>
</form>

<script src="form-validator.js"></script>
</body>
</html>
