<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reusable Modal</title>

<style>
body {
    font-family: Arial, sans-serif;
}

/* Overlay */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

/* Active overlay */
.modal-overlay.active {
    opacity: 1;
    pointer-events: all;
}

/* Modal */
.modal {
    background: #fff;
    width: 400px;
    border-radius: 8px;
    padding: 20px;
    transform: scale(0.9);
    transition: transform 0.3s ease;
}

/* Animate open */
.modal-overlay.active .modal {
    transform: scale(1);
}

/* Header */
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 {
    margin: 0;
}

.close-btn {
    cursor: pointer;
    font-size: 18px;
}

/* Footer buttons */
.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* Button styles */
button {
    padding: 6px 12px;
    cursor: pointer;
}

.secondary {
    background: #e0e0e0;
}

.danger {
    background: #e53935;
    color: white;
}
</style>
</head>

<body>

<button id="openModalBtn">Open Modal</button>

<script src="modal.js"></script>
</body>
</html>
