<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tab Component</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 40px;
    background: #f5f5f5;
}

.tabs-container {
    width: 500px;
    background: #fff;
    border: 1px solid #ccc;
}

/* Tabs header */
.tabs {
    display: flex;
    border-bottom: 1px solid #ccc;
}

.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    border-right: 1px solid #ccc;
    background: #eee;
    outline: none;
}

.tab:last-child {
    border-right: none;
}

.tab.active {
    background: #fff;
    font-weight: bold;
    border-bottom: 2px solid dodgerblue;
}

/* Content */
.tab-content {
    padding: 20px;
    min-height: 100px;
}
</style>
</head>

<body>

<div class="tabs-container">
    <div class="tabs" id="tabs"></div>
    <div class="tab-content" id="tabContent"></div>
</div>

<script src="tabs.js"></script>
</body>
</html>
