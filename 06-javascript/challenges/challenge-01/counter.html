<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .counter-box {
      border: 2px solid #333;
      padding: 20px;
      text-align: center;
      width: 280px;
    }

    #count {
      font-size: 48px;
      margin-bottom: 20px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .steps button {
      padding: 5px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="counter-box">
    <div id="count">0</div>

    <button id="decrement">-</button>
    <button id="reset">Reset</button>
    <button id="increment">+</button>

    <div class="steps">
      <p>Step:</p>
      <button data-step="1">1</button>
      <button data-step="5">5</button>
      <button data-step="10">10</button>
    </div>
  </div>

  <script src="counter.js"></script>
</body>
</html>
